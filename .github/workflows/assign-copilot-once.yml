# One-shot on this agent branch only. Does not run on main.
# Tries Copilot coding-agent assignment + Copilot PR review via GITHUB_TOKEN.
name: Assign Copilot once

on:
  push:
    branches: [cursor/copilot-working-memory-2129]
    paths:
      - .github/workflows/assign-copilot-once.yml

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assign Copilot coding agent and request Copilot reviews
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: "26"
          MEMORY_PR: "24"
        run: |
          set -euo pipefail
          echo "=== viewer / suggestedActors ==="
          gh api graphql \
            -H "GraphQL-Features: issues_copilot_assignment_api_support,coding_agent_model_selection" \
            -f query='query($owner:String!,$name:String!) {
              repository(owner:$owner, name:$name) {
                id
                suggestedActors(capabilities:[CAN_BE_ASSIGNED], first:20) {
                  nodes { login __typename ... on Bot { id } ... on User { id } }
                }
                issue(number: 26) { id number title assignees(first:10) { nodes { login } } }
              }
            }' \
            -f owner="${GITHUB_REPOSITORY%/*}" \
            -f name="${GITHUB_REPOSITORY#*/}" \
            | tee /tmp/actors.json

          COPILOT_ID=$(python3 - <<'PY'
          import json
          data=json.load(open("/tmp/actors.json"))
          nodes=data.get("data",{}).get("repository",{}).get("suggestedActors",{}).get("nodes") or []
          for n in nodes:
              if n.get("login") in ("copilot-swe-agent","copilot-swe-agent[bot]","copilot"):
                  print(n.get("id",""))
                  break
          PY
          )
          ISSUE_ID=$(python3 - <<'PY'
          import json
          data=json.load(open("/tmp/actors.json"))
          issue=(data.get("data") or {}).get("repository",{}).get("issue") or {}
          print(issue.get("id") or "")
          PY
          )
          REPO_ID=$(python3 - <<'PY'
          import json
          data=json.load(open("/tmp/actors.json"))
          print((data.get("data") or {}).get("repository",{}).get("id") or "")
          PY
          )
          echo "COPILOT_ID=$COPILOT_ID ISSUE_ID=$ISSUE_ID REPO_ID=$REPO_ID"

          echo "=== REST agent_assignment copilot-swe-agent[bot] ==="
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/assignees" \
            --input - <<EOF || echo "REST copilot-swe-agent[bot] failed"
          {
            "assignees": ["copilot-swe-agent[bot]"],
            "agent_assignment": {
              "target_repo": "${GITHUB_REPOSITORY}",
              "base_branch": "main",
              "custom_instructions": "Read .github/copilot-briefs/dependabot-fable-triage.md and .github/copilot-instructions.md. Do that. Open a pull request. Then stop.",
              "custom_agent": "captain-culinary",
              "model": ""
            }
          }
          EOF

          echo "=== REST agent_assignment copilot-swe-agent ==="
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/assignees" \
            --input - <<EOF || echo "REST copilot-swe-agent failed"
          {
            "assignees": ["copilot-swe-agent"],
            "agent_assignment": {
              "target_repo": "${GITHUB_REPOSITORY}",
              "base_branch": "main",
              "custom_instructions": "Read .github/copilot-briefs/dependabot-fable-triage.md and do that. Open a pull request. Then stop.",
              "custom_agent": "captain-culinary",
              "model": ""
            }
          }
          EOF

          if [ -n "$COPILOT_ID" ] && [ -n "$ISSUE_ID" ] && [ -n "$REPO_ID" ]; then
            echo "=== GraphQL replaceActorsForAssignable ==="
            gh api graphql \
              -H "GraphQL-Features: issues_copilot_assignment_api_support,coding_agent_model_selection" \
              -f query='mutation($id:ID!,$actor:ID!,$repo:ID!) {
                replaceActorsForAssignable(input: {
                  assignableId: $id
                  actorIds: [$actor]
                  agentAssignment: {
                    targetRepositoryId: $repo
                    baseRef: "main"
                    customInstructions: "Read .github/copilot-briefs/dependabot-fable-triage.md and do that. Open a pull request. Then stop."
                    customAgent: "captain-culinary"
                    model: ""
                  }
                }) {
                  assignable { ... on Issue { number assignees(first:10) { nodes { login } } } }
                }
              }' \
              -f id="$ISSUE_ID" -f actor="$COPILOT_ID" -f repo="$REPO_ID" \
              || echo "GraphQL assign failed"
          else
            echo "Skipping GraphQL assign; Copilot not in suggestedActors or issue missing"
          fi

          echo "=== Request Copilot reviews on open PRs ==="
          for n in $(gh pr list --state open --limit 50 --json number --jq '.[].number'); do
            echo "-- PR #$n"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls/${n}/requested_reviewers" \
              --input - <<< '{"reviewers":["copilot-pull-request-reviewer"]}' \
              || echo "reviewer copilot-pull-request-reviewer failed on #$n"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls/${n}/requested_reviewers" \
              --input - <<< '{"reviewers":["copilot-pull-request-reviewer[bot]"]}' \
              || echo "reviewer copilot-pull-request-reviewer[bot] failed on #$n"
          done

          echo "=== Issue $ISSUE_NUMBER after ==="
          gh issue view "$ISSUE_NUMBER" --json number,title,url,assignees,state || true
          echo "=== Memory PR $MEMORY_PR reviewers ==="
          gh pr view "$MEMORY_PR" --json reviewRequests,assignees || true
