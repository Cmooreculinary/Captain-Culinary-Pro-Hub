# One-shot on this agent branch only. Does not run on main.
name: Seed Copilot brief

on:
  push:
    branches: [cursor/copilot-working-memory-2129]

permissions:
  contents: read
  issues: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Attach full brief to issue 26 and try to assign Copilot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MARKER='<!-- copilot-brief-seed -->'
          comments=$(gh api "repos/${GITHUB_REPOSITORY}/issues/26/comments" --jq '.[].body' || true)
          if printf '%s' "$comments" | grep -q "$MARKER"; then
            echo "Brief already attached to issue 26"
          else
            {
              echo "$MARKER"
              echo
              cat .github/copilot-briefs/dependabot-fable-triage.md
            } > /tmp/brief.md
            gh issue comment 26 --body-file /tmp/brief.md
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/26/assignees" \
            -f assignees[]=copilot-swe-agent \
            || echo "assign copilot-swe-agent failed (expected without user Copilot token)"
          gh issue view 26 --json number,title,url,assignees,state
